name: Local browser benchmark tests

on:
  pull_request:
    paths:
      - 'captcha/local_benchmark/**'
      - 'captcha/movement/**'
      - 'captcha/security_lab/**'
      - 'tests/test_local_benchmark.py'
      - 'tests/test_security_lab.py'
      - '.github/workflows/local-browser-benchmark.yml'
  push:
    branches: [main]
    paths:
      - 'captcha/local_benchmark/**'
      - 'captcha/movement/**'
      - 'captcha/security_lab/**'
      - 'tests/test_local_benchmark.py'
      - 'tests/test_security_lab.py'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic playwright
          python -m playwright install --with-deps chromium
      - name: Run local benchmark tests
        run: |
          python -m unittest tests.test_local_benchmark -v
          python -m unittest tests.test_security_lab -v
